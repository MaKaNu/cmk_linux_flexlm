[project]
name = "cmk-linux-flexlm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matti Kaupenjohann", email = "matti.kaupenjohann@fh-dortmund.de" },
]
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "mkp_tool"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
