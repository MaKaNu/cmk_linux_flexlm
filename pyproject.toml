[project]
name = "cmk-linux-flexlm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matti Kaupenjohann", email = "matti.kaupenjohann@fh-dortmund.de" },
]
requires-python = ">=3.13"
dependencies = []

# Checkmk loads the plugin as cmk_addons.plugins.cmk_linux_flexlm, while mkp-forge
# expects the sources in src/cmk_linux_flexlm. Install them under the Checkmk path.
[tool.uv]
package = true
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"src/cmk_linux_flexlm" = "cmk_addons/plugins/cmk_linux_flexlm"

[dependency-groups]
dev = [
    "mkp-forge>=0.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
